[project]
name = "importkit"
version = "2.0.0"
description = "Embeddable CSV onboarding workflow: map, validate, preview, commit and revert contact imports."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Júlia Mendes", email = "juliamendesazz@gmail.com" }]
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6"]

[project.scripts]
importkit = "importkit.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "TID", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S311"]
"tests/test_migrations.py" = ["E501"]  # verbatim legacy DDL
"src/importkit/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/importkit"]

[[tool.mypy.overrides]]
module = ["importkit.migrations.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:importkit.*",
    # starlette 1.x nudges towards httpx2; the TestClient still works with httpx.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["importkit"]
branch = true
# Alembic loads revision files by path; they are exercised by tests/test_migrations.py.
omit = ["*/importkit/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
